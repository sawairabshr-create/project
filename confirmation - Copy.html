<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed - Antigravity</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="static/images/logo.svg">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="stars"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="static/images/logo.svg" alt="Antigravity Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="book.html">Book Carry</a></li>
                <li><a href="payment.html">Payment</a></li>
                <li><a href="driver.html">Driver Registration</a></li>
                <li><a href="bookings.html">All Bookings</a></li>
                <li><a href="drivers.html">Our Drivers</a></li>
            </ul>
        </div>
    </nav>

    <div class="card form-container confirmation-box" id="confirmationContent">
        <div class="confirmation-icon">✓</div>
        <h1 style="color: white; margin-bottom: 1rem;">Booking Confirmed!</h1>
        <p style="color: var(--text-muted); margin-bottom: 1rem;">Your carry package has been booked successfully.</p>

        <div class="booking-ref" id="bookingRef">
            Loading...
        </div>

        <div class="details-grid" style="text-align: left;" id="bookingDetails">
            <!-- Populated by JavaScript -->
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="book.html" class="btn btn-primary">Book Another</a>
            <a href="index.html" class="btn btn-outline">Go Home</a>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Antigravity Carry Booking. All rights reserved.</p>
    </footer>

    <script src="static/js/main.js"></script>
    <script>
        const ref = localStorage.getItem('ag_last_booking');
        const bookings = JSON.parse(localStorage.getItem('ag_bookings') || '[]');
        const booking = bookings.find(b => b.ref === ref);

        if (booking) {
            document.getElementById('bookingRef').textContent = booking.ref;

            const detailsHtml = `
                <div class="detail-item">
                    <div class="detail-label">Passenger Name</div>
                    <div class="detail-value">${booking.full_name}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Phone</div>
                    <div class="detail-value">${booking.phone}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Pickup Location</div>
                    <div class="detail-value">${booking.pickup_location}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Drop-off Location</div>
                    <div class="detail-value">${booking.dropoff_location}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Package Type</div>
                    <div class="detail-value">${booking.package_type}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Travel Date</div>
                    <div class="detail-value">${booking.travel_date}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Travel Time</div>
                    <div class="detail-value">${booking.travel_time}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Fare Estimate</div>
                    <div class="detail-value">${booking.fare_estimate}</div>
                </div>
                ${booking.driver_name ? `
                <div class="detail-item">
                    <div class="detail-label">Assigned Driver</div>
                    <div class="detail-value">${booking.driver_name}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Driver Phone</div>
                    <div class="detail-value">${booking.driver_phone}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Vehicle</div>
                    <div class="detail-value">${booking.vehicle_type} - ${booking.vehicle_model}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Vehicle Number</div>
                    <div class="detail-value">${booking.vehicle_number}</div>
                </div>
                ` : ''}
            `;
            document.getElementById('bookingDetails').innerHTML = detailsHtml;
        } else {
            document.getElementById('confirmationContent').innerHTML = `
                <div class="confirmation-icon" style="background: linear-gradient(135deg, #ef4444, #dc2626);">✗</div>
                <h1 style="color: white; margin-bottom: 1rem;">Booking Not Found</h1>
                <p style="color: var(--text-muted);">Please make a new booking.</p>
                <a href="book.html" class="btn btn-primary" style="margin-top: 1rem;">Book Now</a>
            `;
        }
    </script>
</body>
</html>
