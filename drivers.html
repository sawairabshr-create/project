<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Drivers - Antigravity</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="static/images/logo.svg">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="stars"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="static/images/logo.svg" alt="Antigravity Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="book.html">Book Carry</a></li>
                <li><a href="payment.html">Payment</a></li>
                <li><a href="driver.html">Driver Registration</a></li>
                <li><a href="bookings.html">All Bookings</a></li>
                <li><a href="drivers.html" class="active">Our Drivers</a></li>
            </ul>
        </div>
    </nav>

    <div class="section-title">
        <h2>Our Drivers</h2>
        <p>Meet our professional delivery team</p>
    </div>

    <div class="grid grid-2" style="max-width: 1000px;" id="driversGrid">
        <!-- Populated by JavaScript -->
    </div>

    <footer class="footer">
        <p>&copy; 2024 Antigravity Carry Booking. All rights reserved.</p>
    </footer>

    <script src="static/js/main.js"></script>
    <script>
        const drivers = JSON.parse(localStorage.getItem('ag_drivers') || '[]');
        const grid = document.getElementById('driversGrid');

        if (drivers.length === 0) {
            grid.innerHTML = `
                <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 3rem;">
                    <p style="color: var(--text-muted);">No drivers registered yet.</p>
                    <a href="driver.html" class="btn btn-primary" style="margin-top: 1rem;">Register as Driver</a>
                </div>
            `;
        } else {
            grid.innerHTML = drivers.map(d => `
                <div class="card driver-card">
                    <div class="driver-avatar">${d.full_name.charAt(0)}</div>
                    <div class="driver-info">
                        <h4>${d.full_name}</h4>
                        <p>${d.vehicle_type} - ${d.vehicle_model}</p>
                        <p>Vehicle: ${d.vehicle_number}</p>
                        <p>City: ${d.city}</p>
                        <p class="driver-rating">★ ${d.rating} Rating</p>
                        <p>Experience: ${d.experience_years} years</p>
                        <p>Phone: ${d.phone}</p>
                        ${d.available
                            ? '<span class="badge badge-success">Available</span>'
                            : '<span class="badge badge-warning">On Delivery</span>'}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
