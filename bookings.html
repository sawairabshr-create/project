<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bookings - Antigravity</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="static/images/logo.svg">
</head>
<body>
    <div class="bg-animation"></div>
    <div class="stars"></div>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <img src="static/images/logo.svg" alt="Antigravity Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="book.html">Book Carry</a></li>
                <li><a href="payment.html">Payment</a></li>
                <li><a href="driver.html">Driver Registration</a></li>
                <li><a href="bookings.html" class="active">All Bookings</a></li>
                <li><a href="drivers.html">Our Drivers</a></li>
            </ul>
        </div>
    </nav>

    <div class="section-title">
        <h2>All Bookings</h2>
        <p>View and manage all carry bookings</p>
    </div>

    <div style="max-width: 1200px; margin: 0 auto; padding: 0 2rem;">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ref #</th>
                        <th>Passenger</th>
                        <th>Phone</th>
                        <th>Route</th>
                        <th>Package</th>
                        <th>Date</th>
                        <th>Fare</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="bookingsTable">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 Antigravity Carry Booking. All rights reserved.</p>
    </footer>

    <script src="static/js/main.js"></script>
    <script>
        const bookings = JSON.parse(localStorage.getItem('ag_bookings') || '[]');
        const tbody = document.getElementById('bookingsTable');

        if (bookings.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" style="text-align: center; padding: 3rem; color: var(--text-muted);">
                        No bookings found. <a href="book.html" style="color: var(--secondary);">Book now</a>
                    </td>
                </tr>
            `;
        } else {
            tbody.innerHTML = bookings.map(b => `
                <tr>
                    <td><strong>${b.ref}</strong></td>
                    <td>${b.full_name}</td>
                    <td>${b.phone}</td>
                    <td>${b.pickup_location} → ${b.dropoff_location}</td>
                    <td>${b.package_type}</td>
                    <td>${b.travel_date} ${b.travel_time}</td>
                    <td>${b.fare_estimate}</td>
                    <td><span class="badge badge-success">${b.status}</span></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
